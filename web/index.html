<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lake Bank</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin: 0 0 .5rem; }
    .sub { color: #666; margin: 0 0 1rem; font-size: 13px; }
    input { width: 100%; padding: .7rem .8rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .status { color: #888; font-size: 12px; margin: .6rem 0; min-height: 1em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #eee; padding: .45rem .6rem; text-align: left; vertical-align: top; }
    th { background: #fafafa; font-weight: 600; }
    td.id { font-family: ui-monospace, monospace; font-size: 12px; color: #555; white-space: nowrap; }
    .empty { color: #888; padding: 1rem; text-align: center; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>Lake Bank</h1>
  <p class="sub">Search SWOT lakes by name prefix (case-insensitive). Powered by SQLite served over HTTP Range requests — no server.</p>

  <input id="q" type="search" placeholder="Type a lake name…" autofocus autocomplete="off">
  <div class="status" id="status">Loading database…</div>
  <table>
    <thead><tr><th>lake_id</th><th>lake_name</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <script type="module">
    import * as sqljsHttpvfs from "https://esm.sh/sql.js-httpvfs@0.8.12";
    const createDbWorker = sqljsHttpvfs.createDbWorker ?? sqljsHttpvfs.default?.createDbWorker;
    if (!createDbWorker) {
      throw new Error("createDbWorker missing — esm.sh export shape changed; inspect `sqljsHttpvfs`");
    }

    // Served from raw.githubusercontent.com: binary content-type, no auto-gzip,
    // Range requests honored, CORS open. jsDelivr would be faster (Fastly CDN)
    // but caps at 20 MB per file; GitHub Pages auto-gzips and breaks ranges.
    const DB_URL = "https://raw.githubusercontent.com/0xNima/lake-bank/main/storage/db/lakes.sqlite";

    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const input = document.getElementById("q");

    // Resolve to absolute URLs so the worker doesn't re-resolve them relative
    // to its own location (which would give .../lib/lib/sql-wasm.wasm).
    const workerUrl = new URL("./lib/sqlite.worker.js", import.meta.url).href;
    const wasmUrl   = new URL("./lib/sql-wasm.wasm",    import.meta.url).href;

    let worker;
    try {
      worker = await createDbWorker(
        [{
          from: "inline",
          config: {
            serverMode: "full",
            url: DB_URL,
            requestChunkSize: 65536,  // matches PRAGMA page_size in collect.py
          },
        }],
        workerUrl,
        wasmUrl,
      );
      statusEl.textContent = "Ready. Type to search.";
    } catch (e) {
      statusEl.innerHTML = `<span class="err">Failed to load database: ${escapeHtml(e.message)}</span>`;
      throw e;
    }

    // Case-insensitive prefix match. The COLLATE NOCASE index on lake_name
    // makes this an indexed range scan, not a full table scan.
    async function search(q, limit = 50) {
      return worker.db.query(
        `SELECT lake_id, lake_name FROM lakes
         WHERE lake_name LIKE ? || '%' COLLATE NOCASE
         ORDER BY lake_name
         LIMIT ?`,
        [q, limit],
      );
    }

    let token = 0;
    let timer = 0;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(runQuery, 120);
    });

    async function runQuery() {
      const q = input.value.trim();
      const my = ++token;
      if (!q) { resultsEl.innerHTML = ""; statusEl.textContent = "Ready."; return; }

      try {
        const t0 = performance.now();
        const rows = await search(q);
        if (my !== token) return;
        renderRows(rows, performance.now() - t0);
      } catch (e) {
        if (my !== token) return;
        resultsEl.innerHTML = `<tr><td colspan="2" class="err">${escapeHtml(e.message)}</td></tr>`;
      }
    }

    function renderRows(rows, ms) {
      if (!rows.length) {
        resultsEl.innerHTML = `<tr><td colspan="2" class="empty">No matches</td></tr>`;
      } else {
        resultsEl.innerHTML = rows
          .map(r => `<tr><td class="id">${escapeHtml(r.lake_id)}</td><td>${escapeHtml(r.lake_name)}</td></tr>`)
          .join("");
      }
      statusEl.textContent = `${rows.length} result${rows.length === 1 ? "" : "s"} in ${ms.toFixed(0)} ms`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // URL-param entrypoints:
    //   ?q=lake+mich              → populate input + render results in the table
    //   ?q=lake+mich&format=json  → replace the page with JSON-only output
    //   ?q=lake+mich&limit=200    → override the default 50-row cap (max 1000)
    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q")?.trim();
    if (initialQuery) {
      if (params.get("format") === "json") {
        const limit = Math.min(parseInt(params.get("limit") ?? "50", 10) || 50, 1000);
        try {
          const rows = await search(initialQuery, limit);
          renderJson({ query: initialQuery, count: rows.length, results: rows });
        } catch (e) {
          renderJson({ query: initialQuery, error: e.message }, true);
        }
      } else {
        input.value = initialQuery;
        runQuery();
      }
    }

    function renderJson(payload, isError = false) {
      document.body.innerHTML = "";
      document.body.style.margin = "0";
      document.body.style.maxWidth = "none";
      const pre = document.createElement("pre");
      pre.style.cssText = "margin:0;padding:1rem;font:13px/1.4 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;word-break:break-word;" + (isError ? "color:#c00;" : "");
      pre.textContent = JSON.stringify(payload, null, 2);
      document.body.appendChild(pre);
    }
  </script>
</body>
</html>
